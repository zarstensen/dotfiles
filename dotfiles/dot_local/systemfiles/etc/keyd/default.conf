
[ids]

*

[main]
capslock = esc
leftshift+leftmeta+f23 = layer(meta)

[control+alt]
# Keyd does not support wildcards like "* = G-*".
# Enumerate the keys you want to transform while Control+Alt is held.

# Digits
1 = G-1
2 = G-2
3 = G-3
4 = G-4
5 = G-5
6 = G-6
7 = G-7
8 = G-8
9 = G-9
0 = G-0

# Letters
a = G-a
b = G-b
c = G-c
d = G-d
e = G-e
f = G-f
g = G-g
h = G-h
i = G-i
j = G-j
k = G-k
l = G-l
m = G-m
n = G-n
o = G-o
p = G-p
q = G-q
r = G-r
s = G-s
t = G-t
u = G-u
v = G-v
w = G-w
x = G-x
y = G-y
z = G-z

# Whitespace / editing
esc = G-esc
tab = G-tab
enter = G-enter
backspace = G-backspace
space = G-space

# Punctuation
minus = G-minus
equal = G-equal
leftbrace = G-leftbrace
rightbrace = G-rightbrace
backslash = G-backslash
semicolon = G-semicolon
apostrophe = G-apostrophe
grave = G-grave
comma = G-comma
dot = G-dot
slash = G-slash

# Navigation
left = G-left
right = G-right
up = G-up
down = G-down
home = G-home
end = G-end
pageup = G-pageup
pagedown = G-pagedown
insert = G-insert
delete = G-delete
